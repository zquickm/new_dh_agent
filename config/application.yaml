server:
  host: 0.0.0.0
  reload: false

internal_request:
  header_name: X-DH-Internal-Token
  token: "dh-internal-token-change-in-production"

llm:
  diagnostics_enabled: true # 临时排查模型工具调用；定位后可关闭
  diagnostics_max_chars: 16384 # 每轮、每层的文本/工具日志分别限额
  diagnostics_max_events: 100
  model: "dsv4"
  base_url: "http://71.10.60.31:8900/v1"
  api_key: "${NEW_DH_LLM__API_KEY:}"
  temperature: 0.6
  timeout: 120

react:
  max_rounds: 5
  force_answer_on_last_round: true

conversation:
  max_history_messages: 20
  run_heartbeat_seconds: 10
  run_lease_seconds: 60
  run_recovery_interval_seconds: 15

persistence:
  host: "${DH_AGENT_DB_HOST:127.0.0.1}"
  port: "${DH_AGENT_DB_PORT:3306}"
  user: "${DH_AGENT_DB_USERNAME}"
  password: "${DH_AGENT_DB_PASSWORD}"
  name: "${DH_AGENT_DB_NAME:dh_agent}"
  pool_size: 10
  max_overflow: 20
  pool_recycle_seconds: 1800
  connect_timeout: 10
  migration_on_startup: true
  migration_lock_timeout: 60

sensitive_words:
  enabled: true

dictionaries:
  cache_directory: "data/dictionaries"
  timeout: 10
  connect_timeout: 3
  verify_ssl: true
  refresh:
    enabled: true
    interval_seconds: 300
    jitter_seconds: 30

skills:
  directory: skills

stream:
  include_process: true
  include_tool_result: false

logging:
  level: INFO
  directory: logs
  retention_days: 14

tools:
  execution_timeout: 300
  spatial:
    base_url: "http://71.10.60.143:6022"
    api_key: "${SPATIAL_API_KEY:}"
    timeout: 30
    connect_timeout: 5
    verify_ssl: true
    max_retries: 1
    retry_backoff: 0.3
  rag:
    base_url: "http://71.10.60.34:18000"
    recall_path: "/rag-platform-default/zsgl/knowledgeRecall"
    recall_url: ""
    api_token: "${RAG_API_TOKEN:}"
    tenant_id: "c3d03091-026c-413a-974e-081a4bbfe8c0"
    libraries:
      政策法规与标准规范:
        top_n: 4 # n1
        api_token: "${RAG_POLICY_API_TOKEN:}"
      核心业务:
        top_n: 4 # n2
        api_token: "${RAG_BUSINESS_API_TOKEN:}"
      海洋图书与文献:
        top_n: 4 # n3
        api_token: "${RAG_LITERATURE_API_TOKEN:}"
    dept_ids:
      - "c3d03091-026c-413a-974e-081a4bbfe8c0"
    score: 0.6 # 固定阈值，不动态下调
    faq_score: 0.8
    search_method: 3
    search_scope: "knowledge"
    timeout: 30
    connect_timeout: 5
    connection_limit: 100
    verify_ssl: true
    max_retries: 2
    retry_backoff: 0.5
    rerank:
      enabled: false
      base_url: "http://71.10.60.34:18000"
      path: "/maas-712f5806/v1/rerank"
      url: ""
      model: "Qwen3-Reranker-4B"
      timeout: 15
      connect_timeout: 5
      max_retries: 1
      retry_backoff: 0.3
      verify_ssl: true
  database:
    information_dir: database_information
    query_guide_file: "数据库_AI_SQL查询指南.md"
    host: "71.10.60.155"
    port: 9030
    user: "dh_agent_reader"
    password: "${BUSINESS_DB_PASSWORD:}"
    name: "donghai_dwd"
    connect_timeout: 5
    query_timeout: 10
    max_rows: 300
    pool_max_size: 3
    ssl_enabled: false
    ssl_ca: null
    ssl_verify_cert: true
    sql_llm:
      base_url: "http://71.10.60.31:8900/v1"
      model: "dsv4"
      api_key: "${DEEPSEEK_API_KEY:}"
      temperature: 0
      timeout: 120
