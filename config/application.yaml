server:
  host: 0.0.0.0
  reload: false

internal_request:
  header_name: X-DH-Internal-Token
  token: "dh-internal-token-change-in-production"

llm:
  diagnostics_enabled: true # 临时排查模型工具调用；定位后可关闭
  diagnostics_max_chars: 16384 # 每轮、每层的文本/工具日志分别限额
  diagnostics_max_events: 100
  model: "dsv4"
  base_url: "http://71.10.60.31:8900/v1"
  api_key: "${NEW_DH_LLM__API_KEY:}"
  temperature: 0
  timeout: 120
  reasoning_effort: none
  context_window_tokens: 131072
  max_output_tokens: 8192
  token_safety_margin: 2048
  tokenizer_path: resources/tokenizers/deepseek-v4/deepseek_v4_tokenizer/tokenizer.json

react:
  max_rounds: 5
  force_answer_on_last_round: true

conversation:
  max_history_messages: 1000
  run_heartbeat_seconds: 10
  run_lease_seconds: 60
  run_recovery_interval_seconds: 15
  run_cancel_poll_seconds: 1
  run_cancel_timeout_seconds: 30

persistence:
  host: "${DH_AGENT_DB_HOST:127.0.0.1}"
  port: "${DH_AGENT_DB_PORT:3306}"
  user: "${DH_AGENT_DB_USERNAME}"
  password: "${DH_AGENT_DB_PASSWORD}"
  name: "${DH_AGENT_DB_NAME:dh_agent}"
  pool_size: 10
  max_overflow: 20
  pool_recycle_seconds: 1800
  connect_timeout: 10
  migration_on_startup: true
  migration_lock_timeout: 60

sensitive_words:
  enabled: true

dictionaries:
  cache_directory: "data/dictionaries"
  timeout: 10
  connect_timeout: 3
  verify_ssl: true
  refresh:
    enabled: true
    interval_seconds: 300
    jitter_seconds: 30

skills:
  directory: skills

stream:
  include_process: true
  include_tool_result: false

logging:
  level: DEBUG
  directory: logs
  retention_days: 14

business_scenarios:
  general: # 通用（三库）
    prompt: |
      当前为通用业务场景。围绕用户实际问题综合分析，明确业务范围、时间与适用条件，
      区分内部资料事实、分析判断和建议；涉及内部业务事实时引用检索依据，资料不足时说明缺口。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 20 # 接口召回数量
          top_n: 4 # 库内按返回分数降序保留数量
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 50
          top_n: 14
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 20
          top_n: 4
      score: 0.6
      result_score_threshold: 0.3
  xiamen: # 厦门
    prompt: |
      当前为厦门业务场景。围绕厦门局业务、海洋监测、生态修复或疑点疑区研判回答，
      优先结合对应报告、规则服务和用户指定范围，明确年份、批次与评价口径，默认使用最新资料；
      不将其他地区资料直接作为厦门的事实依据。
      展示检索到的图片。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 12
          top_n: 3
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 12
          top_n: 4
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 12
          top_n: 3
        - knowledge_id: "${RAG_XIAMEN_KNOWLEDGE_ID:KLB_84c70ad7cd404a1ca8fa35132ba4aad9}"
          name: "厦门局业务"
          recall_top_n: 50
          top_n: 12
      score: 0.6
      result_score_threshold: 0.3
  三新技术适用评估:
    prompt: |
      当前子板块为三新技术适用评估。围绕用户指定技术和业务需求，分析适用条件、数据要求、预期效果、实施成本及局限。
      优先检索使用知识库中的相关研究论文文献。可采取多次检索，扩展相关问题的专业研究方向，结合不同文献的研究结论进行综合分析。
      回答风格采取“现有哪些常用技术，检索文献中有哪些技术，中间进行丰富分析评价，最后得出结论”。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 25
          top_n: 5
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 25
          top_n: 5
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 50
          top_n: 25
      score: 0.6
      result_score_threshold: 0.3
  海洋断面数据分析:
    prompt: |
      当前子板块为海洋断面数据分析。数据使用表格展示。知识库检索结果中的数据不可信，其他内容可信；数据使用数据库查询返回的数据。
      回答风格采取“先分析数据，后结合知识库内容进行分析，最后得出结论”。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 20
          top_n: 4
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 50
          top_n: 14
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 20
          top_n: 4
      score: 0.6
      result_score_threshold: 0.3
  局地生物爆发分析:
    prompt: |
      当前子板块为局地生物爆发分析，主要关注海洋生物灾害的监测、风险研判与防控，包括水母聚集等异常增殖或聚集现象。
      围绕用户指定海域、时间和生物对象，分析发生范围、强度、持续时间、扩散条件，以及对核电冷源安全、海洋生态、养殖渔业、滨海设施和公众活动的影响。
      回答风格采用防控研判简报，按“现状与风险结论—诱发因素与扩散研判—防控措施—监测与复核要点”组织。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 20
          top_n: 4
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 50
          top_n: 14
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 20
          top_n: 4
      score: 0.6
      result_score_threshold: 0.3
  海域空间管控优化:
    prompt: |
      当前子板块为海域空间管控优化。围绕用户指定海域、用海活动和管理目标，综合分析开发利用、生态保护、资源承载与空间冲突，提出可比较、可实施的优化建议。
      回答风格采用规划决策建议，按“管控目标与现状矛盾—约束条件与冲突识别—备选方案比较—推荐方案与实施步骤”组织，突出方案选择的理由与代价。
      以下为默认规则：杭州湾海域不是江苏省的管辖范围。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 30 
          top_n: 6
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 50
          top_n: 13
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 20
          top_n: 3
      score: 0.6
      result_score_threshold: 0.3
  生态环境变化分析:
    prompt: |
      当前子板块为生态环境变化分析。
      回答风格采用监测评估报告，按“总体变化结论—关键指标与时空差异分析—可能驱动因素—生态影响与管理建议”组织，以可核验的数据和比较口径支撑结论。
      结合展示检索到的图片。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 20 # 接口召回数量
          top_n: 4 # 库内按返回分数降序保留数量
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 50
          top_n: 14
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 20
          top_n: 4
      score: 0.6
      result_score_threshold: 0.3
  多类灾害关联分析:
    prompt: |
      当前子板块为多类灾害关联分析。围绕用户指定海域、时间和灾害组合，分析赤潮、绿潮、马尾藻爆发、溢油污染扩散、台风、风暴潮、海浪等的复合影响和灾害链。
      回答按“灾害强度-环境变化-人为活动”综合关联分析。
      展示检索到的图片。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 20 # 接口召回数量
          top_n: 4 # 库内按返回分数降序保留数量
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 50
          top_n: 14
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 20
          top_n: 4
      score: 0.6
      result_score_threshold: 0.3

