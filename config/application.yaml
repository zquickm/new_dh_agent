server:
  host: 0.0.0.0
  reload: false

internal_request:
  header_name: X-DH-Internal-Token
  token: "dh-internal-token-change-in-production"

llm:
  diagnostics_enabled: true # 临时排查模型工具调用；定位后可关闭
  diagnostics_max_chars: 16384 # 每轮、每层的文本/工具日志分别限额
  diagnostics_max_events: 100
  model: "dsv4"
  base_url: "http://71.10.60.31:8900/v1"
  api_key: "${NEW_DH_LLM__API_KEY:}"
  temperature: 0
  timeout: 120
  reasoning_effort: none
  context_window_tokens: 131072
  max_output_tokens: 8192
  token_safety_margin: 2048
  tokenizer_path: resources/tokenizers/deepseek-v4/deepseek_v4_tokenizer/tokenizer.json

react:
  max_rounds: 5
  force_answer_on_last_round: true

conversation:
  max_history_messages: 1000
  run_heartbeat_seconds: 10
  run_lease_seconds: 60
  run_recovery_interval_seconds: 15
  run_cancel_poll_seconds: 1
  run_cancel_timeout_seconds: 30

persistence:
  host: "${DH_AGENT_DB_HOST:127.0.0.1}"
  port: "${DH_AGENT_DB_PORT:3306}"
  user: "${DH_AGENT_DB_USERNAME}"
  password: "${DH_AGENT_DB_PASSWORD}"
  name: "${DH_AGENT_DB_NAME:dh_agent}"
  pool_size: 10
  max_overflow: 20
  pool_recycle_seconds: 1800
  connect_timeout: 10
  migration_on_startup: true
  migration_lock_timeout: 60

sensitive_words:
  enabled: true

dictionaries:
  cache_directory: "data/dictionaries"
  timeout: 10
  connect_timeout: 3
  verify_ssl: true
  refresh:
    enabled: true
    interval_seconds: 300
    jitter_seconds: 30

skills:
  directory: skills

stream:
  include_process: true
  include_tool_result: false

logging:
  level: DEBUG
  directory: logs
  retention_days: 14

business_scenarios:
  general: # 通用（三库）
    prompt: |
      当前为通用业务场景。围绕用户实际问题综合分析，明确业务范围、时间与适用条件，
      区分内部资料事实、分析判断和建议；涉及内部业务事实时引用检索依据，资料不足时说明缺口。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 20 # 接口召回数量
          top_n: 4 # 库内按返回分数降序保留数量
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 50
          top_n: 14
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 20
          top_n: 4
      score: 0.6
      result_score_threshold: 0.3
  xiamen: # 厦门
    prompt: |
      当前为厦门业务场景。围绕厦门局业务、海洋监测、生态修复或疑点疑区研判回答，
      优先结合对应报告、规则服务和用户指定范围，明确年份、批次与评价口径，
      区分监测事实、正式结果、试算结论和建议；不将其他地区资料直接作为厦门的事实依据。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 15
          top_n: 3
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 15
          top_n: 3
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 15
          top_n: 3
        - knowledge_id: "${RAG_XIAMEN_KNOWLEDGE_ID:KLB_bc6985d4abfb4e79b80e5e7b1e0926a3}"
          name: "厦门局业务"
          recall_top_n: 50
          top_n: 15
      score: 0.6
      result_score_threshold: 0.3
  三新技术适用评估: # 初始参数与通用一致，可独立调整
    prompt: |
      当前子板块为三新技术适用评估。围绕用户指定技术和业务需求，分析适用条件、数据要求、
      预期效果、实施成本及局限，区分已有验证与待验证判断；缺少依据时不编造效果或评估结论。
    rag:
      knowledge_bases:
        - knowledge_id: "${RAG_POLICY_KNOWLEDGE_ID:KLB_6f3b2a4e0182429fad6edfc91ebc0854}"
          name: "政策法规与标准规范"
          recall_top_n: 20
          top_n: 4
        - knowledge_id: "${RAG_BUSINESS_KNOWLEDGE_ID:KLB_14a237908da04979b7f0154c15689f46}"
          name: "核心业务"
          recall_top_n: 50
          top_n: 14
        - knowledge_id: "${RAG_LITERATURE_KNOWLEDGE_ID:KLB_f0a1998795cf4b0c90b87b180da88162}"
          name: "海洋图书与文献"
          recall_top_n: 20
          top_n: 4
      score: 0.6
      result_score_threshold: 0.3

